services:

  mqtt:
    image: eclipse-mosquitto:2
    container_name: fleetpulse-mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./infrastructure/mqtt/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mqtt/mosquitto/data:/mosquitto/data
      - ./infrastructure/mqtt/mosquitto/log:/mosquitto/log

    networks:
      - fleetpulse

  mongodb:
    image: mongo:8
    container_name: fleetpulse-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - fleetpulse-mongodb-data:/data/db

    networks:
      - fleetpulse

networks:
  fleetpulse:
    name: fleetpulse-network

volumes:
  fleetpulse-mongodb-data:
    name: fleetpulse-mongodb-data
